name: NullMini
options:
  bundleIdPrefix: studio.nullmini
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    SUPPORTS_MACCATALYST: YES
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  NullMini:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: [OriginalAssets]
        buildPhase: resources
      - path: Resources/OriginalAssets
        optional: true
        type: folder
        buildPhase: resources
      - path: mechanics.json
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: NullMini
        CFBundleShortVersionString: '0.5.0'
        CFBundleVersion: '15'
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: 'Aufnahme starten, wenn du im Ritter-Menü auf Start tippst.'
        NSSpeechRecognitionUsageDescription: 'Deine gestartete Aufnahme lokal transkribieren.'
        NSLocalNetworkUsageDescription: 'Deinen unter Verbindungen eingetragenen iDRAC-Server erreichen.'
        NSCameraUsageDescription: 'Dokumente scannen oder ein Foto für dein Notizbuch aufnehmen.'
        CFBundleDocumentTypes:
          - CFBundleTypeName: Notebook
            CFBundleTypeRole: Editor
            LSItemContentTypes: [studio.nullmini.notebook, com.goodnotesapp.goodnotes.v5, com.adobe.pdf]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: studio.nullmini.notebook
            UTTypeConformsTo: [public.zip-archive]
            UTTypeDescription: NullMini Notebook
            UTTypeTagSpecification:
              public.filename-extension: nullmini
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.goodnotesapp.goodnotes.v5
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: goodnotes
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nullmini.app
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  NullMiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: NullMini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NullMini:
    build:
      targets:
        NullMini: all
        NullMiniTests: [test]
    test:
      targets: [NullMiniTests]
